;2、策略组（域名组-节点组）
;AI 与 Gemini 默认优先走新机场精品线路（2.5x）
custom_proxy_group=✨ Gemini`select`[]美国-精品-自动`[]美国-精品-手选`[]其他-精品-手选`[]美国-手选`[]香港-手选`[]新加坡-自动`[]日本-自动`[]台湾-自动`[]香港-自动`[]其他-手选
custom_proxy_group=👽 AI`select`[]美国-精品-自动`[]美国-精品-手选`[]其他-精品-手选`[]美国-手选`[]美国-自动`[]新加坡-自动`[]台湾-自动`[]日本-自动`[]其他-手选
;YouTube 已移除去广分组，默认走新机场经济线路（1.0x）或老机场节点
custom_proxy_group=📽️ YouTube`select`[]美国-经济-自动`[]美国-经济-手选`[]美国-自动`[]香港-自动`[]新加坡-自动`[]台湾-自动`[]日本-自动`[]美国-手选`[]香港-手选`[]其他-手选`[]DIRECT
;其余日常与流媒体分组严格锁定老机场及经济线路，不放入精品/优选组
custom_proxy_group=🎥 Netflix`select`[]香港-手选`[]美国-自动`[]新加坡-自动`[]台湾-自动`[]香港-自动`[]日本-自动`[]美国-经济-自动`[]其他-手选`[]DIRECT
custom_proxy_group=📹 Emby`select`[]Emby-自动`[]美国-手选`[]新加坡-自动`[]台湾-自动`[]香港-自动`[]日本-自动`[]其他-手选`[]DIRECT
custom_proxy_group=🎞️ 抖声迪`select`[]美国-手选`[]美国-自动`[]新加坡-自动`[]台湾-自动`[]日本-自动`[]香港-手选`[]美国-经济-自动`[]其他-手选`[]DIRECT
custom_proxy_group=🌍 国外`select`[]美国-手选`[]香港-手选`[]美国-自动`[]新加坡-自动`[]台湾-自动`[]香港-自动`[]日本-自动`[]美国-经济-自动`[]其他-手选`[]DIRECT
custom_proxy_group=🦍 国内`select`[]DIRECT`[]美国-手选`[]美国-自动`[]新加坡-自动`[]台湾-自动`[]香港-自动`[]日本-自动`[]其他-手选`[]REJECT

;3、节点组 - 【新机场专属分级组】
;精品线路（2.5x，供 AI 专用，包含洛杉矶常规与住宅 ISP 节点）
custom_proxy_group=美国-精品-自动`url-test`^(?=.*精品)(?=.*(美国|US|🇺🇸)).*`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=美国-精品-手选`select`^(?=.*精品)(?=.*(美国|US|🇺🇸)).*`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=其他-精品-手选`select`^(?=.*精品)(?!.*(美国|US|🇺🇸)).*`http://www.gstatic.com/generate_204`60,300
;经济线路（1.0x，供 YouTube 等大流量场景）
custom_proxy_group=美国-经济-自动`url-test`^(?=.*经济)(?=.*(美国|US|🇺🇸)).*`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=美国-经济-手选`select`^(?=.*经济)(?=.*(美国|US|🇺🇸)).*`http://www.gstatic.com/generate_204`60,300
;优选线路（1.75x，仅保留手选分组备用，不接入任何默认自动策略）
custom_proxy_group=新机场-优选-手选`select`(优选)`http://www.gstatic.com/generate_204`60,300

;4、节点组 - 【老机场专属组】（强制排除 精品/优选/精选/经济，杜绝串流扣费）
custom_proxy_group=美国-手选`select`^(?!.*(精品|优选|精选|经济)).*(美国|US|🇺🇸|纽约|凤凰|亚特兰大)`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=香港-手选`select`^(?!.*(精品|优选|精选|经济)).*(香港|HK|🇭🇰)`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=其他-手选`select`^(?!.*(精品|优选|精选|经济|美国|纽约|美|US|🇺🇸|新加坡|SG|🇸🇬|台湾|TW|🇹🇼|🇨🇳|香港|HK|🇭🇰|日本|JP|🇯🇵|Emby)).*`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=Emby-自动`url-test`(Emby|emby|EMBY)`http://www.gstatic.com/generate_204`300,300
custom_proxy_group=香港-自动`url-test`^(?!.*(精品|优选|精选|经济)).*(香港|HK|🇭🇰)`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=美国-自动`url-test`^(?!.*(精品|优选|精选|经济)).*(美国|US|🇺🇸|纽约|凤凰|亚特兰大)`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=新加坡-自动`url-test`^(?!.*(精品|优选|精选|经济)).*(新加坡|SG|🇸🇬)`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=台湾-自动`url-test`^(?!.*(精品|优选|精选|经济)).*(台湾|TW|🇹🇼|🇨🇳)`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=日本-自动`url-test`^(?!.*(精品|优选|精选|经济)).*(日本|JP|🇯🇵)`http://www.gstatic.com/generate_204`60,300

