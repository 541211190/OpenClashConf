;2、策略组（域名组-节点组）
;AI 优先使用老机场美国或新机场美国经济（1.0x），遇到风控再手动切美国精品（2.5x）
custom_proxy_group=✨ Gemini`select`[]美国-手选`[]美国-经济-手选`[]美国-经济-自动`[]美国-精品-手选`[]美国-精品-自动`[]其他-精品-手选`[]新加坡-自动`[]日本-自动`[]台湾-自动`[]其他-手选
custom_proxy_group=👽 AI`select`[]美国-手选`[]美国-经济-手选`[]美国-经济-自动`[]美国-精品-手选`[]美国-精品-自动`[]其他-精品-手选`[]新加坡-自动`[]日本-自动`[]台湾-自动`[]其他-手选
;视频与流媒体默认走经济（1.0x）及老机场节点，保留香港优选手选作应急
custom_proxy_group=📽️ YouTube`select`[]美国-经济-自动`[]美国-经济-手选`[]美国-自动`[]香港-自动`[]香港-优选-手选`[]新加坡-自动`[]台湾-自动`[]日本-自动`[]美国-手选`[]香港-手选`[]其他-手选
custom_proxy_group=🎥 Netflix`select`[]香港-手选`[]香港-优选-手选`[]美国-自动`[]美国-经济-自动`[]新加坡-自动`[]台湾-自动`[]香港-自动`[]日本-自动`[]其他-手选
custom_proxy_group=📹 Emby`select`[]Emby-自动`[]香港-自动`[]日本-自动`[]其他-手选
;抖声迪已剔除美国精品手选，防止刷 TikTok 误扣 2.5x 流量
custom_proxy_group=🎞️ 抖声迪`select`[]美国-手选`[]美国-经济-自动`[]美国-自动`[]新加坡-自动`[]台湾-自动`[]日本-自动`[]香港-手选`[]其他-手选`[]DIRECT
;日常社交与国外网页优先走老机场亚洲低延迟节点（1.0x）
custom_proxy_group=🌍 国外`select`[]新加坡-自动`[]台湾-自动`[]香港-自动`[]日本-自动`[]美国-经济-自动`[]美国-手选`[]香港-优选-手选`[]香港-手选`[]美国-自动`[]美国-精品-自动`[]美国-精品-手选`[]其他-手选
custom_proxy_group=🦍 国内`select`[]DIRECT`[]美国-手选`[]美国-经济-手选`[]香港-自动`[]其他-手选

;3、节点组 - 【新机场专属分级组】
;精品线路（2.5x，包含洛杉矶常规与住宅 ISP 节点，供 AI 风控时切换）
custom_proxy_group=美国-精品-自动`url-test`^(?=.*精品)(?=.*(美国|US|🇺🇸)).*`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=美国-精品-手选`select`^(?=.*精品)(?=.*(美国|US|🇺🇸)).*`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=其他-精品-手选`select`^(?=.*精品)(?!.*(美国|US|🇺🇸)).*`http://www.gstatic.com/generate_204`60,300
;经济线路（1.0x，包含洛杉矶常规与住宅 ISP 节点，主力看视频及 AI 省流首选）
custom_proxy_group=美国-经济-自动`url-test`^(?=.*经济)(?=.*(美国|US|🇺🇸)).*`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=美国-经济-手选`select`^(?=.*经济)(?=.*(美国|US|🇺🇸)).*`http://www.gstatic.com/generate_204`60,300
;优选线路（1.75x，精准匹配策略组中的“香港-优选-手选”，其余亚洲优选归入备用组）
custom_proxy_group=香港-优选-手选`select`^(?=.*优选)(?=.*(香港|HK|🇭🇰)).*`http://www.gstatic.com/generate_204`60,300
custom_proxy_group=亚洲-优选-手选`select`^(?=.*优选)(?!.*(香港|HK|🇭🇰)).*`http://www.gstatic.com/generate_204`60,300

