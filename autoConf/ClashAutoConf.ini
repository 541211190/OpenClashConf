;双机场聚合自动切换节点配置文件
;排除机场无用的节点（已补充过滤新机场的“余额”和“新网址”）
exclude_remarks=(到期|剩余|重置|时间|官网|产品|失联|佣金|倍率|售后|诚聘|测试|实惠|点击|更新|刷新|教程|客户|如果|导航|余额|新网址)

